<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../images/favicon.ico" />
    <title>My Favorites - MedLink</title>
    <!-- icon -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- globals -->
    <link rel="stylesheet" href="../css/global.css" />
    <!-- specific styles -->
    <link rel="stylesheet" href="../css/citizen-dashboard.css" />
  </head>
  <body>
    <!-- Navbar -->
    <header class="dashboard-header">
      <div class="container flex-between">
        <a href="../index.html" class="logo-link">
          <img src="../images/logo.png" alt="MedLink logo" class="logo" />
        </a>
        <nav class="dashboard-nav">
          <ul class="nav-links">
            <li><a href="citizen-dashboard.html">Dashboard</a></li>
            <li><a href="medicines.html">Medicines</a></li>
            <li><a href="pharmacies.html">Pharmacies</a></li>
            <li><a href="requests.html">My Requests</a></li>
          </ul>
        </nav>
        <div class="header-actions">
          <a
            href="favorites.html"
            class="icon-btn active"
            title="Favorites"
            style="color: var(--danger)"
          >
            <i class="fas fa-heart"></i>
          </a>
          <div class="profile-dropdown">
            <button
              class="profile-btn"
              id="profileToggle"
              title="Profile Details"
            >
              <img src="../images/user.png" alt="User" class="profile-img" />
            </button>
            <div class="dropdown-menu" id="dropdownMenu">
              <div class="dropdown-header">
                <strong>...</strong>
                <p class="text-sm text-muted mb-0">...</p>
              </div>
              <hr class="dropdown-divider" />
              <a href="settings.html" class="dropdown-item"
                ><i class="fas fa-cog"></i> Settings</a
              >
              <a href="requests.html" class="dropdown-item"
                ><i class="fas fa-clipboard-list"></i> My Requests</a
              >
              <hr class="dropdown-divider" />
              <a href="#" onclick="Auth.logout()" class="dropdown-item text-danger"
                ><i class="fas fa-sign-out-alt"></i> Logout</a
              >
            </div>
          </div>
          <button class="mobile-menu-btn"><i class="fas fa-bars"></i></button>
        </div>
      </div>
    </header>

    <main class="dashboard-main pb-0">
      <section class="welcome-banner" style="padding: 40px 0 60px 0">
        <div class="container welcome-container">
          <div
            class="welcome-text page-header"
            style="text-align: center; margin: 0 auto"
          >
            <h1>My <span>Favorites</span></h1>
            <p
              class="subtitle page-header"
              style="text-align: center; margin: 0 auto"
            >
              Everything you loved! Quick access to your frequently purchased
              items and trusted pharmacies.
            </p>
          </div>
        </div>
      </section>

      <div
        class="container main-content-padding mt-4"
        style="margin-top: -30px; position: relative; z-index: 10"
      >
        <div id="favorites-grid" class="grid grid-3">
          <!-- populated by favorites.js -->
        </div>
      </div>
    </main>
    <!-- Scripts -->
    <script src="../js/api-client.js"></script>
    <script src="../js/medlink-ui.js"></script>
    <script src="../js/citizen-dashboard.js"></script>
    <script src="../js/favorites.js"></script>
  </body>
</html>
