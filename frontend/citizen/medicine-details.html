<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" href="../images/favicon.ico" />
    <title>Panadol Extra - MedLink</title>
    <!-- icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <!-- globals -->
    <link rel="stylesheet" href="../css/global.css" />
    <!-- specific styles -->
    <link rel="stylesheet" href="../css/citizen-dashboard.css" />
  </head>
  <body>
    <!-- Navbar -->
    <header class="dashboard-header">
      <div class="container flex-between">
        <a href="../index.html" class="logo-link">
          <img src="../images/logo.png" alt="MedLink logo" class="logo" width="131" height="40" style="height:40px;width:auto;max-width:160px;" />
        </a>
        <nav class="dashboard-nav">
          <ul class="nav-links">
            <li><a href="citizen-dashboard.html">Dashboard</a></li>
            <li><a href="medicines.html" class="active">Medicines</a></li>
            <li><a href="pharmacies.html">Pharmacies</a></li>
            <li><a href="requests.html">My Requests</a></li>
          </ul>
        </nav>
        <div class="header-actions">
          <a href="favorites.html" class="icon-btn " title="Favorites">
            <i class="far fa-heart"></i>
          </a>
          <div class="profile-dropdown">
            <button class="profile-btn" id="profileToggle" title="Profile Details">
              <img src="../images/user.png" alt="User" class="profile-img" />
            </button>
            <div class="dropdown-menu" id="dropdownMenu">
              <div class="dropdown-header">
                <strong>...</strong>
                <p class="text-sm text-muted mb-0">...</p>
              </div>
              <hr class="dropdown-divider" />
              <a href="settings.html" class="dropdown-item"><i class="fas fa-cog"></i> Settings</a>
              <a href="requests.html" class="dropdown-item"><i class="fas fa-clipboard-list"></i> My Requests</a>
              <hr class="dropdown-divider" />
              <a href="#" onclick="Auth.logout()" class="dropdown-item text-danger"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
          </div>
          <button class="mobile-menu-btn"><i class="fas fa-bars"></i></button>
        </div>
      </div>
    </header>

    <main class="dashboard-main pb-0" style="padding-top: 40px;">
      <div class="container pb-100">
        <!-- Breadcrumb -->
        <nav style="margin-bottom: 32px; font-weight: 500;">
          <a href="citizen-dashboard.html" style="color: var(--text-muted);">Dashboard</a> <span style="color: var(--border); margin: 0 12px;">/</span>
          <a href="medicines.html" style="color: var(--text-muted);">Medicines</a> <span style="color: var(--border); margin: 0 12px;">/</span>
          <span id="med-breadcrumb" style="color: var(--primary);">Panadol Extra (500mg)</span>
        </nav>

        <div class="detail-grid">
          <!-- Left: Image -->
          <div class="modern-card detail-image-card">
            <div class="card-image-wrapper detail-image-wrapper">
              <img src="../images/MID.webp" class="card-img" alt="Panadol" />
            </div>
          </div>

          <!-- Right: Info -->
          <div>
            <div class="detail-header-row">
              <h1 id="med-title" class="detail-title">Loading...</h1>
              <button id="med-fav-btn" class="favorite-btn detail-favorite-btn" title="Add to Favorites" style="border: none; background-color: none; border-radius: 50%;"><i class="far fa-heart"></i></button>
            </div>

            <span id="med-category" class="glass-badge" style="position: static; display: inline-block; margin-bottom: 24px; background: var(--accent-soft); box-shadow: none;"></span>

            <p id="med-description" class="text-muted" style="font-size: 1.15rem; line-height: 1.8; margin-bottom: 32px;"></p>

            <div class="card-meta detail-meta">
              <div class="meta-item"><i class="fas fa-store-alt text-success text-xl"></i> <span id="med-pharmacy-count">—</span></div>
              <div class="meta-item"><i class="fas fa-tag text-accent text-xl"></i> <span id="med-price-range">—</span></div>
              <div class="meta-item"><i class="fas fa-prescription text-warning text-xl"></i> <span id="med-prescription">—</span></div>
            </div>

            <div class="card-meta detail-meta" style="margin-top: 16px;">
              <div class="meta-item"><i class="fas fa-industry text-muted text-xl"></i> <span id="med-manufacturer">—</span></div>
              <div class="meta-item"><i class="fas fa-capsules text-muted text-xl"></i> <span id="med-form">—</span> · <span id="med-strength">—</span></div>
              <div class="meta-item"><i class="fas fa-flask text-muted text-xl"></i> <span id="med-ingredients">—</span></div>
            </div>

            <div style="margin-top: 24px;" id="med-extra-info">
              <div style="margin-bottom: 12px;"><strong>Side Effects:</strong> <span id="med-side-effects" class="text-muted">—</span></div>
              <div><strong>Precautions:</strong> <span id="med-precautions" class="text-muted">—</span></div>
            </div>
          </div>
        </div>

        <!-- Section: Available Pharmacies -->
        <div class="mt-80">
            <div class="section-header-flex">
              <h2><i class="fas fa-store text-accent"></i> Pharmacies with Stock</h2>
            </div>
            <div id="pharmacies-grid" class="grid grid-2">
              <!-- populated by medicine-details.js -->
            </div>
        </div>
      </div>
    </main>
    <script src="../js/api-client.js"></script>
    <script src="../js/medlink-ui.js"></script>
    <script src="../js/orders-engine.js"></script>
    <script src="../js/citizen-dashboard.js"></script>
    <script src="../js/medicine-details.js"></script>
  </body>
</html>
