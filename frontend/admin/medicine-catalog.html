<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../images/favicon.ico" />
    <title>Medicine Catalog - MedLink Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/admin-dashboard.css" />
</head>
<body class="admin-layout" data-page="medicines">

    <button class="mobile-sidebar-toggle"><i class="fas fa-bars"></i></button>
    <div class="sidebar-overlay"></div>

    <!-- Sidebar -->
    <aside class="admin-sidebar">
        <div class="sidebar-header">
            <a href="../index.html"><img src="../images/logo.png" alt="MedLink Logo" class="logo" /></a>
            <button class="sidebar-close"><i class="fas fa-times"></i></button>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-group">
                <span class="nav-group-title">Main Menu</span>
                <a href="admin-dashboard.html" class="sidebar-link">
                    <i class="fas fa-th-large"></i><span>Dashboard</span>
                </a>
                <a href="admin-users.html" class="sidebar-link">
                    <i class="fas fa-users"></i><span>Users Control</span>
                </a>
                <a href="admin-pharmacies.html" class="sidebar-link">
                    <i class="fas fa-clinic-medical"></i><span>Pharmacies</span>
                    <span class="sidebar-badge" id="pendingBadge">3</span>
                </a>
            </div>
            <div class="nav-group">
                <span class="nav-group-title">Operations</span>
                <a href="admin-medicines.html" class="sidebar-link active">
                    <i class="fas fa-pills"></i><span>Medicine Catalog</span>
                </a>
                <a href="admin-reports.html" class="sidebar-link">
                    <i class="fas fa-flag"></i><span>Reports & Monitoring</span>
                </a>
            </div>
        </nav>
        <div class="sidebar-footer">
            <a href="../index.html" class="sidebar-link text-danger">
                <i class="fas fa-sign-out-alt"></i><span>Logout</span>
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
        <header class="admin-header">
            <div class="admin-title">
                <h1><i class="fas fa-pills" style="color: var(--accent); font-size: 1.5rem; margin-right: 8px;"></i> Medicine Catalog</h1>
                <p>Manage the global medicine database. Pharmacies pick from this catalog.</p>
            </div>
        </header>

        <!-- Medicines Inventory Monitoring -->

        <!-- Search -->
        <div class="admin-search-bar">
            <i class="fas fa-search"></i>
            <input type="text" id="medicinesSearch" placeholder="Search medicines by name or category..." />
        </div>

        <!-- Medicine Table -->
        <div class="admin-card">
            <div class="admin-card-header">
                <h3><i class="fas fa-boxes" style="color: var(--accent); margin-right: 8px;"></i> All Medicines</h3>
            </div>
            <div class="admin-card-body">
                <div class="admin-table-wrapper">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Category</th>
                                <th>Strength</th>
                                <th>Stock Level</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="medicinesTableBody">
                            <!-- Injected by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/medlink-ui.js"></script>
    <script src="../js/admin-dashboard.js"></script>
</body>
</html>
